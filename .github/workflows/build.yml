# LUMAFLOW release builds: Linux (DEB, TGZ, AppImage), Windows (NSIS installer, ZIP), macOS (DMG arm64 + x86_64).
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build qt6-base-dev qt6-base-dev-tools libqt6opengl6-dev libgl-dev libegl-dev \
            libgl1-mesa-dri libavformat-dev libavcodec-dev libswscale-dev libavutil-dev zlib1g-dev libsqlite3-dev \
            libasound2-dev xvfb ffmpeg libfuse2 file

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/usr
          cmake --build build

      - name: Tests (Xvfb + Mesa)
        run: xvfb-run -a -s "-screen 0 1920x1080x24" ctest --test-dir build --output-on-failure

      - name: Packages (DEB, TGZ)
        working-directory: build
        run: cpack -G "DEB;TGZ"

      - name: AppImage
        run: |
          mkdir -p /tmp/tools
          cd /tmp/tools
          wget -q https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -O linuxdeploy
          wget -q https://github.com/linuxdeploy/linuxdeploy-plugin-qt/releases/download/continuous/linuxdeploy-plugin-qt-x86_64.AppImage -O linuxdeploy-plugin-qt
          wget -q https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage -O appimagetool
          chmod +x linuxdeploy linuxdeploy-plugin-qt appimagetool
          cd "$GITHUB_WORKSPACE"
          BUILD="$GITHUB_WORKSPACE/build" OUT="$GITHUB_WORKSPACE/dist" ./installers/linux/build_appimage.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lumaflow-linux
          path: |
            build/*.deb
            build/*.tar.gz
            dist/*.AppImage
          if-no-files-found: error

  windows:
    runs-on: windows-2022
    env:
      VCPKG_DEFAULT_TRIPLET: x64-windows
    steps:
      - uses: actions/checkout@v4

      - uses: jurplel/install-qt-action@v4
        with:
          version: "6.7.3"
          arch: win64_msvc2019_64

      - name: vcpkg dependencies (FFmpeg, zlib, SQLite, pkgconf)
        shell: pwsh
        run: vcpkg install ffmpeg[avcodec,avformat,swscale]:x64-windows zlib:x64-windows sqlite3:x64-windows pkgconf:x64-windows

      - uses: ilammy/msvc-dev-cmd@v1

      - name: Configure and build (Spout 2 built from source, pinned commit)
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUMAFLOW_WITH_ALSA=OFF -DLUMAFLOW_WITH_SPOUT=ON -DLUMAFLOW_BUILD_TESTS=OFF `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DPKG_CONFIG_EXECUTABLE="$vcpkg/installed/x64-windows/tools/pkgconf/pkgconf.exe"
          cmake --build build

      - name: Deploy Qt and dependencies, build NSIS installer and ZIP
        shell: pwsh
        run: |
          windeployqt --release --no-translations build/src/lumaflow.exe build/src/lumaflow-cli.exe
          Copy-Item "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin/*.dll" build/src/
          cd build
          cpack -G "NSIS;ZIP"

      - uses: actions/upload-artifact@v4
        with:
          name: lumaflow-windows
          path: |
            build/*.exe
            build/*.zip
          if-no-files-found: error

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            arch: arm64
          - os: macos-13
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Dependencies
        run: brew install qt ffmpeg ninja pkg-config sqlite

      - name: Syphon framework (BSD, pinned)
        run: |
          git clone https://github.com/Syphon/Syphon-Framework.git /tmp/syphon
          git -C /tmp/syphon checkout f4761677a45b8034a3c2069ec0f3d2553da81fba
          xcodebuild -project /tmp/syphon/Syphon.xcodeproj -scheme Syphon -configuration Release \
            CONFIGURATION_BUILD_DIR=/tmp/syphon-build CODE_SIGNING_ALLOWED=NO build

      - name: Configure and build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DLUMAFLOW_BUILD_TESTS=OFF \
            -DCMAKE_PREFIX_PATH="$(brew --prefix qt)" -DSYPHON_FRAMEWORK_DIR=/tmp/syphon-build
          cmake --build build

      - name: Bundle, sign, notarise, DMG
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: ./installers/macos/package_macos.sh build ${{ matrix.arch }}

      - uses: actions/upload-artifact@v4
        with:
          name: lumaflow-macos-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error
